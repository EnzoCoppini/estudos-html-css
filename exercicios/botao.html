<style>
   .subscibre-button{
    background-color: rgb(200, 0, 0);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 2px;
    cursor: pointer;
    margin-right: 8px;
    transition: opacity 0.3s
    }
    
    .subscibre-button:hover{
      opacity: 0.8;
    }

    .subscibre-button:active{
      opacity: 0.5;
    }

    .join-button{
      background-color: white;
      color: rgb(79, 128, 202);
      border-color: rgb(79, 128, 202);
      border-style: solid;
      border-width: 1px;
      padding: 10px 16px;
      border-radius: 2px;
      cursor: pointer;
      margin-right: 8px;
    }

    .join-button:hover{
      background-color: rgb(79, 128, 202);
      color: white;
    }

    .join-button:active{
      opacity: 0.6; 
    }

    .tweet-button{
      background-color: rgb(69, 177, 240);
      color: white;
      border: none;
      border-radius: 18px;
      padding: 10px 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .tweet-button:hover{
      box-shadow: 1px 1px 1px rgb(128, 127, 127);
    }

    .signup-button{
      background-color: rgb(46,164,79);
      border: none;
      border-radius: 4px;
      color: white;
      padding: 10px 16px;
      /*cursor: pointer serve para quado o usuario passar por cima de algo clicavel, o estado do mouse se altera.*/
      cursor: pointer;
      margin-left: 8px;
    }
    
    /*a pseudoclasse hover server para quando o usuário passar por cima de um botão ou algo, ele altera o estado*/
    .signup-button:hover{
      /*box-shadow server para fazer um sombreamento sobre algo*/
      box-shadow: 1px 1px 1px rgb(128, 127, 127);
    }

    /*a pseudoclasse active serve para quando o usuário apertar em algum botão, ele mudar a cor ou a opacidade*/
    .signup-button:active{
      opacity: 0.6;
    }
</style>


<button class="subscibre-button">SUBSCRIBE</button>

<button class="join-button">JOIN</button>

<button class="tweet-button">Tweet</button>

<button class="signup-button">Sign up</button>
